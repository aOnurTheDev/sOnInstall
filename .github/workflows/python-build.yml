# This workflow will build Python packages on every commit.

name: Build sOninstall

on: [ push, pull_request ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare arch
        run: |
          pacman-key --init
          pacman --noconfirm -Sy archlinux-keyring
          pacman --noconfirm -Syyu
          pacman --noconfirm -Sy python-uv python-setuptools python-pip
          pacman --noconfirm -Sy python-pyparted python-pydantic python-textual
      - name: Remove existing sOninstall (if any)
        run: 
          uv pip uninstall soninstall --break-system-packages --system
      - name: Build sOninstall
        run: uv build --no-build-isolation --wheel
      - name: Install sOninstall
        run: |
          uv pip install dist/*.whl --break-system-packages --system --no-build --no-deps
      - name: Run sOninstall
        run: |
          python -V
          soninstall --script guided -v
          soninstall --script only_hd -v
          soninstall --script minimal -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soninstall
          path: dist/*
